<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-snake"></i> 贪吃蛇游戏</h1>
            <p class="subtitle">使用方向键控制蛇的移动，吃到食物增长身体，避免撞墙或撞到自己！</p>
        </header>

        <div class="game-area">
            <div class="game-info">
                <div class="score-board">
                    <div class="score-item">
                        <span class="score-label">得分</span>
                        <span id="score" class="score-value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">最高分</span>
                        <span id="high-score" class="score-value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">长度</span>
                        <span id="length" class="score-value">3</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="start-btn" class="btn btn-primary">
                        <i class="fas fa-play"></i> 开始游戏
                    </button>
                    <button id="pause-btn" class="btn btn-secondary">
                        <i class="fas fa-pause"></i> 暂停
                    </button>
                    <button id="reset-btn" class="btn btn-danger">
                        <i class="fas fa-redo"></i> 重新开始
                    </button>
                </div>
                
                <div class="difficulty">
                    <h3><i class="fas fa-tachometer-alt"></i> 难度设置</h3>
                    <div class="difficulty-options">
                        <label class="difficulty-option">
                            <input type="radio" name="difficulty" value="easy" checked>
                            <span class="difficulty-label">简单</span>
                        </label>
                        <label class="difficulty-option">
                            <input type="radio" name="difficulty" value="medium">
                            <span class="difficulty-label">中等</span>
                        </label>
                        <label class="difficulty-option">
                            <input type="radio" name="difficulty" value="hard">
                            <span class="difficulty-label">困难</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="game-container">
                <canvas id="game-canvas" width="600" height="600"></canvas>
                <div id="game-over" class="game-over">
                    <h2>游戏结束!</h2>
                    <p id="final-score">得分: 0</p>
                    <button id="restart-btn" class="btn btn-primary">
                        <i class="fas fa-redo"></i> 重新开始
                    </button>
                </div>
                <div id="game-paused" class="game-paused">
                    <h2>游戏暂停</h2>
                    <p>按空格键继续</p>
                </div>
            </div>

            <div class="instructions">
                <h3><i class="fas fa-info-circle"></i> 游戏说明</h3>
                <ul>
                    <li><i class="fas fa-arrow-up"></i> <strong>上箭头</strong> - 向上移动</li>
                    <li><i class="fas fa-arrow-down"></i> <strong>下箭头</strong> - 向下移动</li>
                    <li><i class="fas fa-arrow-left"></i> <strong>左箭头</strong> - 向左移动</li>
                    <li><i class="fas fa-arrow-right"></i> <strong>右箭头</strong> - 向右移动</li>
                    <li><i class="fas fa-space-shuttle"></i> <strong>空格键</strong> - 暂停/继续游戏</li>
                    <li><i class="fas fa-apple-alt"></i> 吃到红色食物增加1分，蛇身增长</li>
                    <li><i class="fas fa-skull-crossbones"></i> 撞到墙壁或自己的身体游戏结束</li>
                </ul>
            </div>
        </div>

        <footer>
            <p>贪吃蛇游戏 &copy; 2026 | 使用 HTML5 Canvas, CSS3 和 JavaScript 制作</p>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
